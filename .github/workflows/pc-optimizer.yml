name: HexaTune (Windows)

on:
  push:
    paths:
      - 'pc-optimizer/**'
      - '.github/workflows/pc-optimizer.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: pc-optimizer

jobs:
  test:
    # 使い捨ての Windows VM で、すべての設定を実際に適用→元に戻して確かめる
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc-optimizer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node test/windows-smoke.js

  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pc-optimizer/package-lock.json
      - run: npm ci
      - run: npx electron-builder --win nsis portable --publish never
      - name: 画面のスモークテスト（設定は変更しない）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          $env:HEXATUNE_SMOKE_DIR = (Resolve-Path smoke).Path
          $p = Start-Process -FilePath 'release\win-unpacked\HexaTune.exe' -ArgumentList '--smoke-test', '--enable-logging=stderr' -PassThru -Wait -RedirectStandardOutput smoke\stdout.txt -RedirectStandardError smoke\stderr.txt
          Get-Content smoke\stdout.txt
          Get-Content smoke\stderr.txt -Tail 60
          if ($p.ExitCode -ne 0) { throw "スモークテスト失敗 (exit $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: pc-optimizer/smoke/
      - uses: actions/upload-artifact@v4
        with:
          name: HexaTune-windows
          path: |
            pc-optimizer/release/*.exe

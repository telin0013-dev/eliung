<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>HexaTune</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="backdrop"></div>

<div class="titlebar">
  <div class="reboot-pill" id="rebootPill"><span>再起動で反映される変更があります</span><button id="rebootNow">今すぐ再起動</button></div>
  <div class="winbtns">
    <button id="wMin" title="最小化"></button>
    <button id="wMax" title="最大化"></button>
    <button id="wClose" class="close" title="閉じる"></button>
  </div>
</div>

<nav class="sidebar">
  <div class="logo" id="logo"></div>
  <div class="nav" id="nav"></div>
  <div class="bottom" id="navBottom"></div>
</nav>

<main class="main" id="main"></main>
<div class="toasts" id="toasts"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e8fff"/><stop offset="1" stop-color="#38d0ff"/>
    </linearGradient>
  </defs>
</svg>

<script src="module-shim.js"></script>
<script src="../engine/tweaks.js"></script>
<script src="icons.js"></script>
<script src="mock-api.js"></script>
<script src="app.js"></script>
</body>
</html>
